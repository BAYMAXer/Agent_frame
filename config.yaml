# osworld_agent 示例配置
# 换模型 = 改下面 model / grounding_model 的名字（对应 models.py 里的注册表）即可，不动代码。

# ---------------- 决策模型 ----------------
model:
  name: "9b"                 # 注册表里的名字，见 model/decision_model.py 的 MODEL_REGISTRY
  url: "http://7.246.80.237:9028/v1"
  api_key: "EMPTY"
  temperature: 0.3
  max_tokens: 2048
  vision: true               # 是否把截图喂给决策模型（纯文本模型设 false）

# ---------------- 视觉定位模型 ----------------
grounding_model:
  name: "ui_tars_7b"
  url: "http://7.246.80.237:49999/v1"
  api_key: "EMPTY"
  width: 1920
  height: 1080

# ---------------- 智能体循环 ----------------
agent:
  max_steps: 20              # 单任务最大步数
  max_retries: 3             # 动作解析失败最多重试几次
  enable_reflection: true    # 是否开启反思（reflection）
  early_stop_repeat: 3       # 连续相同动作 N 次即早停

# ---------------- 环境 ----------------
env:
  provider: "osworld"        # 目前只支持 osworld
  os: "linux"                # 目标机操作系统：linux / mac / windows（决定终端命令 shell）
  vm_path: "/data/osworld-agent-s/vm/uploaded/Ubuntu.qcow2"
  sleep_after_execution: 1.5 # 每步动作后等待秒数（截图前）
  headless: false
  screen_width: 1920
  screen_height: 1080
