<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComponentBench v2 SFT 数据浏览器</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --txt:#172033; --muted:#6b7482; --accent:#2f6fed; --ok:#0a8a4f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; }
  header .sp { flex:1; }
  select, input { font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--txt); }
  .wrap { display:flex; height:calc(100vh - 52px); }
  aside { width:320px; min-width:260px; border-right:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; }
  aside .search { padding:10px; border-bottom:1px solid var(--line); }
  aside .search input { width:100%; }
  aside ul { list-style:none; margin:0; padding:0; overflow-y:auto; flex:1; }
  aside li { padding:9px 12px; border-bottom:1px solid #f0f2f4; cursor:pointer; }
  aside li:hover { background:#eef3fd; }
  aside li.active { background:#e3ecfc; border-left:3px solid var(--accent); }
  aside li .tid { font-size:13px; font-weight:600; word-break:break-all; }
  aside li .meta { font-size:12px; color:var(--muted); margin-top:2px; }
  main { flex:1; overflow-y:auto; padding:16px; }
  .bar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .bar .info { font-size:13px; color:var(--muted); }
  .bar button { padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .bar button:disabled { opacity:.4; cursor:default; }
  .stepgrid { display:grid; grid-template-columns: minmax(360px, 1.1fr) minmax(320px, 1fr); gap:14px; align-items:start; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .panel .pt { font-size:12px; font-weight:600; color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--line); background:#fafbfc; }
  .panel img { display:block; width:100%; height:auto; background:#000; }
  .panel .body { padding:12px; max-height:64vh; overflow:auto; }
  .panel pre { margin:0; white-space:pre-wrap; word-break:break-word; font-family:Consolas,"Courier New",monospace; font-size:12.5px; line-height:1.5; }
  .actionbox { margin-top:14px; border:1px solid #bfe3cd; background:#eefaf2; border-radius:10px; }
  .actionbox .pt { color:var(--ok); background:#e3f5ea; }
  .actionbox .body { font-size:15px; font-weight:600; }
  .actionbox code { background:#dff0e6; padding:2px 6px; border-radius:4px; font-family:Consolas,monospace; }
  .hint { color:var(--muted); font-size:13px; padding:20px; }
</style>
</head>
<body>
<header>
  <h1>ComponentBench v2 · SFT 数据浏览器</h1>
  <span class="sp"></span>
  <label>动作空间
    <select id="mode">
      <option value="bid">bid（ax_tree：click('id')）</option>
      <option value="coord">coord（pixel：mouse_click）</option>
    </select>
  </label>
  <label>切分
    <select id="split">
      <option value="train">train</option>
      <option value="val">val</option>
      <option value="test">test</option>
    </select>
  </label>
</header>
<div class="wrap">
  <aside>
    <div class="search"><input id="q" placeholder="搜索 task_id / 组件 / 库"></div>
    <ul id="list"></ul>
  </aside>
  <main id="main"><div class="hint">加载中…</div></main>
</div>

<script>
let cur = {mode:'bid', split:'train', list:[], idx:-1, step:0, traj:null};
const $ = id => document.getElementById(id);

async function loadList() {
  const res = await fetch(`/api/list?mode=${cur.mode}&split=${cur.split}`);
  cur.list = await res.json();
  cur.idx = -1; cur.step = 0; cur.traj = null;
  renderList();
  if (cur.list.length) select(0);
}
function renderList() {
  const q = $('q').value.trim().toLowerCase();
  const ul = $('list'); ul.innerHTML = '';
  cur.list.forEach((t, i) => {
    const hay = (t.task_id+' '+t.component+' '+t.library).toLowerCase();
    if (q && !hay.includes(q)) return;
    const li = document.createElement('li');
    li.className = i === cur.idx ? 'active' : '';
    li.innerHTML = `<div class="tid">${t.task_id}</div>
      <div class="meta">${t.component} · ${t.library} · ${t.n_steps} 步</div>`;
    li.onclick = () => select(i);
    ul.appendChild(li);
  });
}
async function select(i) {
  cur.idx = i; cur.step = 0;
  renderList();
  const t = cur.list[i];
  const res = await fetch(`/api/traj?mode=${cur.mode}&split=${cur.split}&id=${t.id}`);
  cur.traj = await res.json();
  renderStep();
}
function renderStep() {
  const t = cur.traj; if (!t) return;
  const s = t.steps[cur.step];
  const human = s.human.replace(/^<image>\s*/,'');   // 去掉 <image> 占位（截图单独展示）
  $('main').innerHTML = `
    <div class="bar">
      <div class="info"><b>${t.task_id}</b> · ${t.component} · ${t.library} · 共 ${t.n_steps} 步</div>
      <span class="sp" style="flex:1"></span>
      <button id="prev" ${cur.step===0?'disabled':''}>← 上一步</button>
      <span style="font-size:13px">${cur.step+1} / ${t.n_steps}</span>
      <button id="next" ${cur.step===t.n_steps-1?'disabled':''}>下一步 →</button>
    </div>
    <div class="stepgrid">
      <div class="panel">
        <div class="pt">截图 step ${cur.step}</div>
        ${s.image ? `<img src="/${s.image}" alt="screenshot">` : '<div class="hint">无截图</div>'}
      </div>
      <div>
        <div class="panel">
          <div class="pt">输入（goal + 规则 + 无障碍树）</div>
          <div class="body"><pre>${escapeHtml(human)}</pre></div>
        </div>
        <div class="panel actionbox">
          <div class="pt">模型要学的动作（assistant / gpt）</div>
          <div class="body"><code>${escapeHtml(s.action)}</code></div>
        </div>
      </div>
    </div>`;
  $('prev').onclick = () => { cur.step--; renderStep(); };
  $('next').onclick = () => { cur.step++; renderStep(); };
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

$('mode').onchange = e => { cur.mode = e.target.value; loadList(); };
$('split').onchange = e => { cur.split = e.target.value; loadList(); };
$('q').oninput = renderList;
loadList();
</script>
</body>
</html>
